<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app: blob: data:; script-src 'self' app: blob: 'wasm-unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: blob: data: https:; connect-src 'self' app: blob: data: https://app.lovepdf.me https://www.lovepdf.me https://lovepdf.me; font-src 'self' app: data:; worker-src 'self' app: blob:;">
<title>LovePDF Reader and Editor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-group">
      <button class="tb" id="btnHome" data-ic="home" title="Home"></button>
      <button class="tb tb-text" id="btnOpen" data-ic="folder" title="Ctrl+O"><span data-t="open">Open</span></button>
      <button class="tb tb-text" id="btnSave" data-ic="save" title="Ctrl+S" disabled><span data-t="save">Save</span></button>
      <button class="tb" id="btnPrint" data-ic="printer" title="Ctrl+P" disabled></button>
    </div>
    <div class="tb-group doc-only">
      <span class="sep"></span>
      <button class="tb" id="btnSidebar" data-ic="sidebar" title="F4"></button>
      <button class="tb" id="pgPrev" data-ic="left" title="Previous page"></button>
      <input id="pgNum" type="text" inputmode="numeric" value="1" aria-label="Page"><span class="muted">/ <span id="pgTotal">0</span></span>
      <button class="tb" id="pgNext" data-ic="right" title="Next page"></button>
      <span class="sep"></span>
      <button class="tb" id="zoomOut" data-ic="minus" title="Ctrl+-"></button>
      <select id="zoomSel" aria-label="Zoom"><option value="width">Fit width</option><option value="page">Fit page</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select>
      <button class="tb" id="zoomIn" data-ic="plus" title="Ctrl+="></button>
      <span class="sep"></span>
      <div class="dd"><button class="tb tb-text" id="btnRotateMenu" data-ic="rotcw"><span data-t="rotate">Rotate</span> ▾</button><div class="dd-menu" id="rotateMenu" hidden>
        <button data-rot="view" data-ic="eye"><span data-t="rot.view">Rotate view only</span></button>
        <button data-rot="cw" data-ic="rotcw"><span data-t="rot.cw">Rotate this page ↻</span></button>
        <button data-rot="ccw" data-ic="rotccw"><span data-t="rot.ccw">Rotate this page ↺</span></button>
        <button data-rot="all" data-ic="layers"><span data-t="rot.all">Rotate all pages ↻</span></button></div></div>
      <button class="tb tb-text" id="btnCrop" data-ic="crop"><span data-t="crop">Crop</span></button>
      <button class="tb" id="btnFind" data-ic="search" title="Ctrl+F"></button>
    </div>
    <div class="tb-group doc-only">
      <div class="seg" id="modeSeg"><button id="modeView" class="on" data-ic="eye"><span data-t="viewMode">View</span></button><button id="modeEdit" data-ic="edit"><span data-t="editMode">Edit</span></button></div>
      <button class="tb tb-text" id="btnPages" data-ic="grid"><span data-t="pages">Pages</span></button>
      <button class="tb tb-text" id="btnTools" data-ic="tools"><span data-t="tools">Tools</span></button>
    </div>
    <div class="tb-group tb-end">
      <button class="tb" id="btnSettings" data-ic="settings" title="Settings"></button>
    </div>
  </header>
  <div id="tabs" hidden></div>
  <div id="editbar" hidden>
    <div class="ed-modes" id="edModes"></div>
    <span class="sep"></span>
    <label class="ed-opt"><span data-t="edit.color">Color</span> <input type="color" id="edColor" value="#d00000"></label>
    <label class="ed-opt"><span data-t="edit.size">Size</span> <input type="range" id="edSize" min="4" max="96" value="14"><span id="edSizeV">14</span></label>
    <label class="ed-opt chk"><input type="checkbox" id="edBold"> <span data-t="edit.bold">Bold</span></label>
    <span class="sep"></span>
    <button class="tb" id="edUndo" data-ic="undo" title="Ctrl+Z"></button><button class="tb" id="edRedo" data-ic="redo" title="Ctrl+Y"></button><button class="tb" id="edDel" data-ic="trash" title="Delete"></button>
    <span class="ed-hint" id="edHint"></span>
    <input type="file" id="edImgInput" accept="image/*" hidden>
  </div>
  <div id="cropbar" hidden>
    <b data-t="cropUi.title">Crop pages</b><span class="muted" id="cropInfo"></span><span class="sp"></span>
    <button class="btn btn-sm" id="cropAuto" data-ic="zap"><span data-t="cropUi.auto">Auto-trim white margins</span></button>
    <button class="btn btn-sm" id="cropCancel"><span data-t="cancel">Cancel</span></button>
    <button class="btn btn-sm btn-primary" id="cropApplyAll"><span data-t="cropUi.applyAll">Apply to all pages</span></button>
    <button class="btn btn-sm btn-primary" id="cropApply"><span data-t="cropUi.applyOne">Apply to this page</span></button>
  </div>
  <div id="findbar" hidden>
    <input id="findInput" type="search" placeholder="Find in document…"><span id="findCount" class="muted"></span>
    <button class="tb" id="findPrev" data-ic="left" title="Shift+Enter"></button><button class="tb" id="findNext" data-ic="right" title="Enter"></button><button class="tb" id="findClose" data-ic="x"></button>
  </div>
  <main id="main">
    <section id="home">
      <div class="home-hero">
        <img src="icon.png" alt="" width="72" height="72">
        <div><h1 data-t="appName">LovePDF Reader and Editor</h1><p class="muted"><span data-t="dropHint">Drag &amp; drop PDF files anywhere in this window</span> · <span data-t="orClick">or click Open PDF</span></p></div>
        <button class="btn btn-primary btn-lg" id="homeOpen" data-ic="folder"><span data-t="openPdf">Open PDF</span></button>
      </div>
      <div class="home-grid">
        <div class="home-col">
          <div class="home-head"><h2 data-t="recent">Recent files</h2><button class="link" id="recentClear" data-t="clearRecent">Clear list</button></div>
          <div id="recentList" class="recent"></div>
        </div>
        <div class="home-col">
          <h2 data-t="quickTools">Quick tools</h2>
          <div id="homeTools" class="qt-grid"></div>
        </div>
      </div>
      <p class="home-foot muted">⚡ <span data-t="set.about1"></span> · <a href="#" data-ext="https://www.lovepdf.me/?utm_source=windows-app">www.lovepdf.me</a></p>
    </section>
    <section id="docArea" hidden>
      <aside id="sidebar" hidden>
        <div class="sb-tabs"><button class="on" data-sb="thumbs" data-t="thumbnails">Pages</button><button data-sb="outline" data-t="outline">Bookmarks</button></div>
        <div id="sbThumbs" class="sb-pane"></div>
        <div id="sbOutline" class="sb-pane" hidden></div>
      </aside>
      <div id="viewport" tabindex="0"><div id="pagesWrap"></div></div>
    </section>
  </main>
  <footer id="status"><span id="statusMsg"></span><span class="sp"></span><span id="statusRight" class="muted"></span></footer>
  <div id="modal" hidden><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><span class="sp"></span><button class="tb" id="modalClose" data-ic="x"></button></div><div id="modalBody"></div></div></div>
  <div id="toast" hidden></div>
  <div id="dropOverlay" hidden><div>📄 Drop PDF files here</div></div>
  <div id="printArea" aria-hidden="true"></div>
</div>
<script src="/vendor/pdf-lib.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
